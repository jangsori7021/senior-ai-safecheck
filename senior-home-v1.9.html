<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 안심 확인 v1.9</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#fff;color:#171717}
main{max-width:520px;margin:auto;padding:24px 18px 36px}h1{font-size:32px;line-height:1.25;margin:20px 0 8px}
.lead{font-size:21px;line-height:1.55;margin:0 0 26px;color:#444}.card{width:100%;min-height:116px;border:2px solid #222;border-radius:22px;background:white;text-align:left;padding:20px;margin:0 0 16px;font-size:26px;font-weight:800}
.card span{display:block;font-size:18px;font-weight:500;margin-top:8px;color:#555}.primary{background:#171717;color:white}
.help{width:100%;min-height:62px;border:0;background:#f1f1f1;border-radius:18px;font-size:20px;font-weight:700;margin-top:10px}
.note{margin-top:30px;font-size:16px;line-height:1.5;color:#666;text-align:center}
</style></head><body><main>
<div style="font-size:18px;font-weight:800">AI 안심 확인</div>
<h1>무엇이 걱정되세요?</h1>
<p class="lead">어렵게 설명하지 않아도 괜찮아요.<br>보여주시거나 말씀해 주세요.</p>
<button class="card primary" onclick="document.getElementById('photo').click()">📷 보여주세요<span>문자 · 안내문 · 스마트폰 화면을 찍어요</span></button>
<input id="photo" type="file" accept="image/*" capture="environment" hidden onchange="showPhoto(this)">
<button class="card" onclick="alert('음성 기능은 지원 브라우저/실서버 연결 상태에 따라 작동합니다.')">🎙️ 말씀하세요<span>궁금한 걸 그냥 말해요</span></button>
<button class="help">👨‍👩‍👧 가족에게 도움받기</button>
<div id="msg" class="note">처음 화면에는 꼭 필요한 것만 보여드립니다.</div>
<script>
function showPhoto(i){if(i.files&&i.files[0])document.getElementById('msg').innerHTML='<b>사진을 받았어요.</b><br>실제 AI 서버가 연결되면 여기서 바로 확인합니다.'}
</script></main></body></html>
