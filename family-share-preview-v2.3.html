<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가족에게 보여주기</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#171717}main{max-width:520px;margin:auto;padding:24px 18px}h1{font-size:31px}.lead,.box{font-size:20px;line-height:1.55}.box{background:#f3f3f3;padding:20px;border-radius:20px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #ddd;font-size:19px}.btn{width:100%;min-height:70px;border:0;border-radius:18px;background:#171717;color:#fff;font-size:21px;font-weight:850;margin-top:18px}.alt{background:#eee;color:#171717}input{width:26px;height:26px}</style></head>
<body><main><div style="font-weight:900">AI 안심 확인</div><h1>가족에게 보여드릴까요?</h1><p class="lead">보내기 전에 무엇을 공유하는지 먼저 확인할 수 있어요.</p>
<div class="box"><b>공유할 내용</b><br>⚠️ 조금 더 확인하는 게 좋아요.<br><br>• 링크를 누르지 않기<br>• 돈을 보내지 않기<br>• 공식 연락처로 확인하기</div>
<div class="row"><span>AI 결과 보내기</span><input type="checkbox" checked></div>
<div class="row"><span>원래 사진도 보내기</span><input type="checkbox"></div>
<div class="row"><span>지난 기록도 보여주기</span><input type="checkbox"></div>
<button class="btn">가족에게 보내기</button><button class="btn alt">지금은 안 보낼래요</button>
</main></body></html>
