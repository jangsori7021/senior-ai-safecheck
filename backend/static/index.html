<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#365f63"><link rel="manifest" href="/manifest.json"><title>시니어 AI 생활 도우미 v3.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:#202a2f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:600px;margin:auto;padding:22px 16px 40px}.screen{display:none}.screen.on{display:block}.top{font-size:22px;font-weight:900;margin-bottom:18px}.hero,.box{border-radius:26px;padding:24px;background:#fff;margin-bottom:16px}.hero{background:#365f63;color:#fff}.hero h1{margin:0 0 10px;font-size:38px;line-height:1.25}.hero p,.box{font-size:21px;line-height:1.6}.grid,.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn,.card,.choice{border:0;border-radius:22px;font-weight:900}.card{background:#fff;min-height:150px;padding:20px 15px;text-align:left;font-size:23px;color:#202a2f}.card span{display:block;font-size:38px;margin-bottom:10px}.card small{display:block;font-size:16px;font-weight:600;color:#667478;margin-top:8px;line-height:1.45}.btn{width:100%;min-height:76px;padding:16px 18px;margin:7px 0;background:#365f63;color:#fff;font-size:23px}.light{background:#e7efea;color:#29484b}.voice{background:#fff;color:#365f63;font-size:27px;min-height:92px;margin-top:18px}.choice{min-height:92px;background:#fff;font-size:22px;color:#26383a;padding:14px}.back{border:0;background:none;color:#365f63;font-size:20px;font-weight:900;padding:8px 0 16px}.answer{font-size:22px;line-height:1.7}.hint{font-size:17px;line-height:1.5;color:#edf4f1;margin-top:12px}.version{text-align:center;color:#8b999b;margin-top:22px}.wide{grid-column:1/-1}img{width:100%;max-height:330px;object-fit:contain;border-radius:20px}@media(max-width:390px){.hero h1{font-size:34px}.card{font-size:21px}.choice{font-size:20px}}</style></head><body><main><div class="top">AI · 시니어 AI 생활 도우미</div><section id="home" class="screen on"><div class="hero"><h1>무엇을 도와드릴까요?</h1><p>찾는 방법을 몰라도 괜찮아요.<br>말하거나 큰 버튼만 누르세요.</p><button class="btn voice" onclick="listen('ask')">🎙️ 말로 물어보기</button><div class="hint">예: “칼국수 먹고 싶어” · “동대구역 가고 싶어” · “이게 무슨 뜻이야?”</div></div><div class="grid"><button class="card" onclick="photo()"><span>📷</span>사진으로 확인<small>문자·제품·안내문을 보여주세요</small></button><button class="card" onclick="show('food')"><span>🍚</span>먹을 곳 찾기<small>말하거나 같이 골라봐요</small></button><button class="card" onclick="listen('nav')"><span>🚌</span>길·대중교통<small>가고 싶은 곳을 말하세요</small></button><button class="card" onclick="health()"><span>💊</span>건강생활 도움<small>약·건강제품을 쉽게 설명해요</small></button><button class="card wide" onclick="listen('ask')"><span>💬</span>생활 속 궁금한 것<small>말이 서툴러도 괜찮아요. AI가 쉬운 말로 답해요.</small></button><button class="card wide" onclick="family()"><span>👨‍👩‍👧</span>가족에게 도움 요청<small>혼자 해결하기 어려우면 가족에게 알려요</small></button></div><div class="version">시니어 AI 생활 도우미 v3.2</div></section><section id="food" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><div class="hero"><h1>오늘 뭐 드시고 싶으세요?</h1><p>바로 말씀하셔도 되고, 제가 같이 골라드릴 수도 있어요.</p></div><button class="btn" onclick="listen('food')">🎙️ 먹고 싶은 음식 말하기</button><button class="btn light" onclick="show('choose')">😊 뭘 먹을지 같이 골라줘</button></section><section id="choose" class="screen"><button class="back" onclick="show('food')">← 뒤로</button><h1>생각나는 쪽을 눌러보세요</h1><div class="choices"><button class="choice" onclick="menu('한식')">🍚 한식</button><button class="choice" onclick="menu('면 국수')">🍜 면·국수</button><button class="choice" onclick="menu('생선 해물')">🐟 생선·해물</button><button class="choice" onclick="menu('고기')">🥩 고기</button><button class="choice" onclick="menu('중식')">🥟 중식</button><button class="choice" onclick="menu('일식')">🍣 일식</button><button class="choice" onclick="menu('양식')">🍝 양식</button><button class="choice" onclick="menu('카페 간식')">☕ 카페·간식</button></div><button class="btn light" onclick="mood()">🤔 그래도 잘 모르겠어요</button></section><section id="sub" class="screen"><button class="back" onclick="show('choose')">← 뒤로</button><h1 id="subTitle"></h1><div id="subChoices" class="choices"></div></section><section id="voice" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><div class="hero"><h1>편하게 말씀하세요</h1><p id="voiceText">🎙️ 듣고 있어요…</p></div></section><section id="answer" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>쉽게 알려드릴게요</h1><div id="answerText" class="box answer"></div><button class="btn" onclick="speakAnswer()">🔊 소리로 듣기</button><button class="btn light" onclick="family()">👨‍👩‍👧 가족에게 보여주기</button></section><section id="photoScreen" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>사진으로 보여주세요</h1><div id="preview"></div><button class="btn" id="analyzeBtn" onclick="analyze()" style="display:none">AI에게 확인해 주세요</button><button class="btn light" onclick="document.getElementById('file').click()">📷 사진 찍기·고르기</button></section><input id="file" type="file" accept="image/*" capture="environment" hidden onchange="picked(this)"><script>let currentFile=null,lastAnswer='';const menus={'한식':['백반','국밥','찌개','불고기','보쌈','비빔밥'],'면 국수':['칼국수','잔치국수','냉면','수제비','우동','메밀국수'],'생선 해물':['해물탕','해물찜','생선구이','회','아구찜','매운탕'],'고기':['갈비','삼겹살','불고기','닭요리','오리고기','보쌈'],'중식':['짜장면','짬뽕','탕수육','볶음밥','만두'],'일식':['초밥','돈가스','우동','회','덮밥'],'양식':['파스타','스테이크','피자','샐러드'],'카페 간식':['커피','차','빵','떡','빙수']};function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}function menu(k){document.getElementById('subTitle').textContent=k+' 중에서 골라보세요';document.getElementById('subChoices').innerHTML=menus[k].map(x=>'<button class="choice" onclick="near(\''+x+'\')">'+x+'</button>').join('');show('sub')}function mood(){document.getElementById('subTitle').textContent='오늘은 어떤 게 좋으세요?';document.getElementById('subChoices').innerHTML=['따뜻한 국물','가볍게','든든하게','생선·해물','매콤하게','면 요리'].map(x=>'<button class="choice" onclick="near(\''+x+'\')">'+x+'</button>').join('');show('sub')}function near(q){location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('근처 '+q)}function health(){lastAnswer='약이나 건강제품은 사진으로 보여주세요. 이름과 사용 안내를 쉽게 설명해 드릴게요. 복용량 변경이나 치료 결정은 의사나 약사에게 꼭 확인해 주세요.';document.getElementById('answerText').textContent=lastAnswer;show('answer')}function listen(mode){show('voice');const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){document.getElementById('voiceText').textContent='이 휴대폰에서는 바로 듣기가 어려워요. 사진이나 큰 버튼을 이용해 주세요.';return}const r=new S();r.lang='ko-KR';r.onresult=e=>route(e.results[0][0].transcript,mode);r.onerror=()=>document.getElementById('voiceText').textContent='잘 듣지 못했어요. 천천히 다시 말씀해 주세요.';r.start()}function route(q,mode){if(mode==='food'||/먹|맛집|식당|국수|한식|해물|고기|카페/.test(q)){near(q);return}if(mode==='nav'||/가고|길|버스|지하철|역/.test(q)){location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q.replace(/가고 싶어|가고싶어|가는 길|길 알려줘/g,''));return}askAI(q)}async function askAI(q){document.getElementById('voiceText').textContent='AI가 쉬운 말로 생각하고 있어요…';try{const r=await fetch('/api/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});if(!r.ok)throw 0;const d=await r.json();lastAnswer=d.answer;document.getElementById('answerText').textContent=lastAnswer;show('answer')}catch(e){lastAnswer='지금은 답을 가져오지 못했어요. 잠시 뒤 다시 말씀해 주세요.';document.getElementById('answerText').textContent=lastAnswer;show('answer')}}function speakAnswer(){if(!lastAnswer||!speechSynthesis)return;const u=new SpeechSynthesisUtterance(lastAnswer);u.lang='ko-KR';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}function family(){const d={title:'시니어 AI 생활 도우미',text:lastAnswer||'도움이 필요해요. 같이 확인해 주세요.',url:location.origin};if(navigator.share)navigator.share(d).catch(()=>{});else navigator.clipboard.writeText(d.text+' '+d.url).then(()=>alert('내용을 복사했어요. 가족에게 보내주세요.'))}function photo(){show('photoScreen');document.getElementById('file').click()}function picked(i){currentFile=i.files[0];if(!currentFile)return;document.getElementById('preview').innerHTML='<img src="'+URL.createObjectURL(currentFile)+'">';document.getElementById('analyzeBtn').style.display='block'}async function analyze(){if(!currentFile)return;const fd=new FormData();fd.append('image',currentFile);fd.append('mode','safe');fd.append('voice_context','');try{const r=await fetch('/api/v1/analyze-image',{method:'POST',body:fd});if(!r.ok)throw 0;const d=await r.json(),a=d.analysis||d;lastAnswer=[a.summary,...((a.risk&&a.risk.reasons)||[]),...(a.important_points||[])].filter(Boolean).join('. ');document.getElementById('answerText').textContent=lastAnswer;show('answer')}catch(e){lastAnswer='사진 확인을 끝내지 못했어요. 잠시 뒤 다시 시도해 주세요.';document.getElementById('answerText').textContent=lastAnswer;show('answer')}}</script></main></body></html>
