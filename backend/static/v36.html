<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#426b67"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>시니어 AI 생활 도우미 v3.6</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#25302f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:600px;margin:auto;padding:10px 12px 82px}.screen{display:none}.screen.on{display:block}.top{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;margin-bottom:9px}.logo{width:36px;height:36px;border-radius:12px;background:#426b67;color:#fff;display:grid;place-items:center}.share{margin-left:auto;border:0;border-radius:12px;padding:8px 11px;background:#e4eeea;color:#315754;font-size:16px;font-weight:900}.hero{background:#426b67;color:#fff;border-radius:21px;padding:16px}.hero h1,h1{font-size:28px;line-height:1.18;margin:0 0 6px}.hero p{font-size:16px;line-height:1.4;margin:0;color:#eff6f3}.askrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.askbtn{min-height:58px;border:0;border-radius:17px;font-size:20px;font-weight:950}.voicebtn{background:#fff;color:#315754}.textbtn{background:#e5f0eb;color:#315754}.title{font-size:17px;font-weight:900;margin:13px 2px 7px}.grid,.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card,.choice,.btn{border:0;border-radius:17px;font-weight:900}.card{min-height:102px;background:#fff;padding:10px;text-align:left;box-shadow:0 4px 12px #2232}.card i{font-style:normal;font-size:26px;display:block;margin-bottom:4px}.card b{font-size:19px}.card small{display:block;font-size:13px;line-height:1.25;color:#687675;margin-top:4px}.wide{grid-column:1/-1;min-height:74px}.back{border:0;border-radius:13px;background:#e4eeea;color:#315754;font-size:18px;font-weight:900;padding:9px 12px;margin:0 0 12px}.box{background:#fff;border-radius:18px;padding:17px;margin:10px 0;font-size:19px;line-height:1.55}.btn{width:100%;min-height:60px;background:#426b67;color:#fff;font-size:20px;padding:12px;margin:5px 0}.alt{background:#e8efeb;color:#34514f}.choice{background:#fff;min-height:80px;font-size:19px;padding:10px;box-shadow:0 4px 12px #2232}.choice span{display:block;font-size:27px;margin-bottom:3px}.input{width:100%;font-size:22px;padding:15px;border:2px solid #b9cbc3;border-radius:15px;outline:none}.input:focus{border-color:#426b67}.stickyNav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#ffffffee;border-top:1px solid #dfe7e3;display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));justify-content:center}.stickyNav button{flex:1;max-width:220px;border:0;border-radius:15px;min-height:52px;font-size:17px;font-weight:900}.homeBtn{background:#315754;color:#fff}.stopBtn{background:#efe6df;color:#6a3d28}.version{text-align:center;color:#98a39f;margin-top:12px;font-size:12px}.playerWrap{background:#fff;border-radius:18px;padding:10px}.playerWrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}</style></head><body><main><div class="top"><div class="logo">AI</div><span>시니어 AI 생활 도우미</span><button class="share" onclick="shareApp()">↗ 공유</button></div><section id="home" class="screen on"><div class="hero"><h1>무엇을 도와드릴까요?</h1><p>말로 하셔도 되고, 글자로 쓰셔도 됩니다.</p><div class="askrow"><button class="askbtn voicebtn" onclick="voice('general')">🎙️ 말로 물어보기</button><button class="askbtn textbtn" onclick="openText('general')">⌨️ 글자로 입력하기</button></div></div><div class="title">자주 쓰는 도움</div><div class="grid"><button class="card" onclick="photo()"><i>📷</i><b>사진으로 확인</b><small>물건·글씨·안내문을 찍어 물어보세요</small></button><button class="card" onclick="show('food')"><i>🍚</i><b>먹을 곳 찾기</b><small>식당 찾고 길안내까지</small></button><button class="card" onclick="show('nav')"><i>🗺️</i><b>길찾기·내비</b><small>차·대중교통·도보 선택</small></button><button class="card" onclick="health()"><i>💊</i><b>건강생활 도움</b><small>약·제품을 쉽게 확인</small></button><button class="card" onclick="show('music')"><i>🎵</i><b>음악 듣기</b><small>트로트·7080·찬양·찬송가</small></button><button class="card" onclick="openText('ask')"><i>💬</i><b>생활 질문</b><small>말하거나 글자로 물어보세요</small></button><button class="card wide" onclick="show('family')"><i>👨‍👩‍👧</i><b>가족에게 도움 요청</b><small>딸·아들·보호자에게 바로 연락</small></button></div><div class="version">시니어 AI 생활 도우미 v3.6</div></section><section id="text" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>글자로 입력하세요</h1><div class="box">말하기 어려운 곳에서는 아래 칸에 직접 써도 됩니다.</div><input id="textInput" class="input" placeholder="예: 동대구역 가고 싶어요"><button class="btn" onclick="submitText()">확인</button></section><section id="food" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>먹고 싶은 걸 골라보세요</h1><div class="choices"><button class="choice" onclick="foodChoice('한식')"><span>🍚</span>한식</button><button class="choice" onclick="foodChoice('중식')"><span>🥟</span>중식</button><button class="choice" onclick="foodChoice('면 국수')"><span>🍜</span>면·국수</button><button class="choice" onclick="foodChoice('고기')"><span>🥩</span>고기</button><button class="choice" onclick="voice('fooddest')"><span>🎙️</span>식당 이름 말하기</button><button class="choice" onclick="openText('fooddest')"><span>⌨️</span>식당 이름 쓰기</button></div></section><section id="foodGo" class="screen"><button class="back" onclick="show('food')">← 뒤로</button><h1 id="foodTitle">식당을 찾아볼게요</h1><button class="btn" onclick="openFoodSearch()">📍 근처 식당 보기</button><button class="btn alt" onclick="voice('fooddest')">🎙️ 식당 이름 말하기</button><button class="btn alt" onclick="openText('fooddest')">⌨️ 식당 이름 쓰기</button></section><section id="nav" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>어디로 가고 싶으세요?</h1><button class="btn" onclick="voice('navdest')">🎙️ 목적지 말하기</button><button class="btn alt" onclick="openText('navdest')">⌨️ 목적지 글자로 쓰기</button></section><section id="route" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1 id="routeTitle">어떻게 갈까요?</h1><div class="choices"><button class="choice" onclick="goRoute('driving')"><span>🚗</span>차로 가기</button><button class="choice" onclick="goRoute('transit')"><span>🚌</span>대중교통</button><button class="choice" onclick="goRoute('walking')"><span>🚶</span>걸어가기</button><button class="choice" onclick="openText('navdest')"><span>⌨️</span>목적지 다시 쓰기</button></div></section><section id="music" class="screen"><button class="back" onclick="stopMusic();show('home')">⌂ 처음으로</button><h1>어떤 음악을 들을까요?</h1><div class="choices"><button class="choice" onclick="musicList('트로트')"><span>🎤</span>트로트</button><button class="choice" onclick="musicList('7080')"><span>📻</span>7080</button><button class="choice" onclick="musicList('찬양')"><span>🙏</span>찬양</button><button class="choice" onclick="musicList('찬송가')"><span>⛪</span>찬송가</button><button class="choice" onclick="voice('music')"><span>🎙️</span>가수 말하기</button><button class="choice" onclick="openText('music')"><span>⌨️</span>가수·노래 쓰기</button></div></section><section id="musicList" class="screen"><button class="back" onclick="show('music')">← 다른 종류</button><h1 id="musicListTitle"></h1><div id="musicItems"></div></section><section id="player" class="screen"><button class="back" onclick="stopMusic();show('musicList')">← 다른 곡 고르기</button><h1 id="playerTitle">음악 재생</h1><div class="playerWrap"><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></section><section id="family" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>누구에게 연락할까요?</h1><div class="choices"><button class="choice" onclick="familyPerson('딸')"><span>👩</span>딸</button><button class="choice" onclick="familyPerson('아들')"><span>👨</span>아들</button><button class="choice" onclick="familyPerson('보호자')"><span>🧑‍🤝‍🧑</span>보호자</button><button class="choice" onclick="familyPerson('가족')"><span>☎️</span>다른 가족</button></div></section><section id="familyDetail" class="screen"><button class="back" onclick="show('family')">← 뒤로</button><h1 id="familyTitle"></h1><input id="phone" class="input" inputmode="tel" placeholder="전화번호 입력"><button class="btn" onclick="savePhone()">전화번호 저장</button><button class="btn" onclick="callFamily()">📞 전화하기</button><button class="btn alt" onclick="textFamily()">💬 문자 보내기</button></section><section id="voice" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>편하게 말씀하세요</h1><div id="voiceStatus" class="box">🎙️ 듣고 있어요...</div><button class="btn alt" onclick="openText(currentMode)">⌨️ 글자로 입력하기</button></section><section id="ask" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>쉽게 설명해 드릴게요</h1><div id="answer" class="box"></div><button class="btn" onclick="speakAnswer()">🔊 소리로 듣기</button><button class="btn alt" onclick="openText('ask')">⌨️ 다시 글자로 질문</button></section><section id="simple" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1 id="st"></h1><div id="sb" class="box"></div><button id="sa" class="btn"></button></section><section id="preview" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>이 사진을 확인할까요?</h1><img id="img" style="width:100%;max-height:330px;object-fit:contain;border-radius:18px"><button class="btn" onclick="analyze()">AI에게 확인해 주세요</button></section><section id="loading" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>제가 살펴보고 있어요</h1><div class="box">잠시만 기다려 주세요.</div></section><section id="result" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1 id="rh"></h1><div id="rr" class="box"></div></section><input id="photo" hidden type="file" accept="image/*" capture="environment" onchange="picked(this)"></main><div id="sticky" class="stickyNav" style="display:none"><button class="stopBtn" onclick="stopMusic()">■ 음악 끄기</button><button class="homeBtn" onclick="stopMusic();show('home')">⌂ 처음으로</button></div><script>let file=null,lastText='',dest='',foodQuery='',familyKey='',currentMode='general';const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('sticky').style.display=id==='player'?'flex':'none';scrollTo(0,0)}function openText(mode){currentMode=mode||'general';$('textInput').value='';show('text');setTimeout(()=>$('textInput').focus(),100)}function submitText(){const q=$('textInput').value.trim();if(!q)return alert('내용을 입력해 주세요.');route(q,currentMode)}function foodChoice(q){foodQuery=q+' 맛집';$('foodTitle').textContent=q+' 식당을 찾아볼게요';show('foodGo')}function openFoodSearch(){location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('근처 '+foodQuery)}function setDestination(q){dest=q.trim();$('routeTitle').textContent='“'+dest+'” 어떻게 갈까요?';show('route')}function goRoute(mode){if(!dest)return;location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode='+mode+(mode==='driving'?'&dir_action=navigate':'')}function voice(mode){currentMode=mode;show('voice');const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){$('voiceStatus').textContent='음성 인식을 사용할 수 없어요. 아래 글자 입력을 눌러주세요.';return}let r=new S();r.lang='ko-KR';r.onresult=e=>route(e.results[0][0].transcript,mode);r.onerror=()=>{$('voiceStatus').textContent='잘 듣지 못했어요. 다시 말씀하거나 글자로 입력해 주세요.'};r.start()}function route(q,mode){if(mode==='navdest'||mode==='fooddest'){setDestination(q);return}if(mode==='music'){musicList(q.replace(/틀어줘|들려줘|노래|음악/g,'').trim()||'트로트');return}if(mode==='general'){if(/가고|길|버스|지하철|자동차|차로|내비|역/.test(q)){setDestination(q.replace(/가고 싶어|가고싶어|길 알려줘|안내해줘/g,''));return}if(/노래|음악|트로트|찬양|찬송|7080/.test(q)){musicList(q);return}if(/먹|맛집|식당|국수|한식|중식|고기|해물/.test(q)){foodQuery=q+' 맛집';show('foodGo');return}}askAI(q)}async function askAI(q){show('loading');try{let r=await fetch('/api/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});if(!r.ok)throw 0;let p=await r.json();lastText=p.answer||'답변을 준비하지 못했어요.';$('answer').textContent=lastText;show('ask')}catch(e){alert('답변을 가져오지 못했어요.')}}function health(){simple('건강생활 도움','약 봉투나 건강제품을 사진으로 보여주세요.','📷 사진으로 보여주기',photo)}function simple(t,b,l,f){$('st').textContent=t;$('sb').innerHTML=b;$('sa').textContent=l;$('sa').onclick=f;show('simple')}function photo(){$('photo').click()}function picked(i){file=i.files&&i.files[0];if(!file)return;$('img').src=URL.createObjectURL(file);show('preview')}async function analyze(){if(!file)return;show('loading');let fd=new FormData();fd.append('image',file);fd.append('mode','safe');fd.append('voice_context','');try{let r=await fetch('/api/v1/analyze-image',{method:'POST',body:fd});if(!r.ok)throw 0;let p=await r.json(),a=p.analysis||p;let rs=(a.risk&&a.risk.reasons)||a.important_points||[];$('rh').textContent=a.summary||'확인했습니다.';$('rr').innerHTML='<b>중요한 점</b><br>'+rs.slice(0,3).map(x=>'• '+x).join('<br>');show('result')}catch(e){alert('사진 확인을 끝내지 못했어요.')}}function musicList(kind){$('musicListTitle').textContent=kind+' 골라듣기';const qs=[kind+' 인기곡 모음',kind+' 명곡 모음',kind+' 연속듣기'];$('musicItems').innerHTML=qs.map(q=>'<button class="btn alt" onclick="playMusic(\''+q.replace(/'/g,'')+'\')">🎵 '+q+'</button>').join('');show('musicList')}function playMusic(q){$('playerTitle').textContent=q;$('yt').src='https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(q)+'&autoplay=1';show('player')}function stopMusic(){$('yt').src='';$('sticky').style.display='none'}function familyPerson(k){familyKey=k;$('familyTitle').textContent=k+'에게 연락하기';$('phone').value=localStorage.getItem('senior_phone_'+k)||'';show('familyDetail')}function savePhone(){localStorage.setItem('senior_phone_'+familyKey,$('phone').value.trim());alert('저장했습니다.')}function callFamily(){const p=$('phone').value.replace(/[^0-9+]/g,'');if(p)location.href='tel:'+p}function textFamily(){const p=$('phone').value.replace(/[^0-9+]/g,'');if(p)location.href='sms:'+p}function speakAnswer(){if(!lastText)return;let u=new SpeechSynthesisUtterance(lastText);u.lang='ko-KR';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}async function shareApp(){try{if(navigator.share)await navigator.share({title:'시니어 AI 생활 도우미',text:'쉽게 말하고, 쓰고, 사진으로 물어보는 시니어 AI 생활 도우미입니다.',url:location.origin});else{await navigator.clipboard.writeText(location.origin);alert('앱 주소를 복사했습니다.')}}catch(e){}}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
