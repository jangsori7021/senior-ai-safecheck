<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b57"><link rel="manifest" href="/manifest.json"><title>시니어 AI 생활비서 v4.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#26302f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:600px;margin:auto;padding:10px 12px 84px}.screen{display:none}.screen.on{display:block}.top{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;margin-bottom:9px}.logo{width:38px;height:38px;border-radius:13px;background:#315b57;color:#fff;display:grid;place-items:center}.share{margin-left:auto;border:0;border-radius:12px;padding:9px 12px;background:#e2ece7;font-size:16px;font-weight:900}.hero{background:linear-gradient(145deg,#315b57,#47766e);color:#fff;border-radius:23px;padding:18px}h1{font-size:28px;line-height:1.18;margin:0 0 9px}.hero p{font-size:17px;line-height:1.4;margin:0;color:#eef6f2}.askrow,.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.askrow{margin-top:13px}.ask,.btn,.card,.back,.smallBtn{border:0;font-weight:900}.ask{min-height:64px;border-radius:18px;font-size:21px}.voice{background:#fff;color:#315b57}.text,.alt{background:#e3eee9;color:#315b57}.sectionTitle{font-size:18px;font-weight:900;margin:15px 2px 8px}.card{background:#fff;border-radius:19px;min-height:118px;padding:13px;text-align:left;box-shadow:0 4px 14px #2132}.card i{font-style:normal;font-size:30px;display:block;margin-bottom:5px}.card b{font-size:20px}.card small{display:block;font-size:14px;line-height:1.3;color:#667572;margin-top:5px}.tools{width:100%;border:0;border-radius:17px;background:#e6eee9;color:#315b57;font-size:20px;font-weight:900;padding:16px;margin-top:11px}.back{border-radius:13px;background:#e2ece7;color:#315b57;font-size:18px;padding:10px 13px;margin-bottom:12px}.box,.item{background:#fff;border-radius:18px;padding:16px;margin:9px 0;box-shadow:0 3px 10px #2231}.box{font-size:19px;line-height:1.55}.btn{width:100%;min-height:64px;border-radius:17px;background:#315b57;color:#fff;font-size:21px;padding:12px;margin:6px 0}.input{width:100%;font-size:21px;padding:15px;border:2px solid #b8cbc3;border-radius:15px;margin:6px 0}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#e5eee9;color:#315b57;font-weight:900;font-size:13px;margin-right:5px}.dateTag{background:#fff0dc;color:#795927}.item b{display:block;font-size:19px;line-height:1.4;margin:6px 0}.item small{display:block;color:#667572}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.smallBtn{border-radius:12px;min-height:43px;font-size:16px;background:#e6eee9;color:#315b57}.delete{background:#f4e6e1;color:#7d4639}.today{background:#fff7e9;border:2px solid #ead6ae}.version{text-align:center;color:#97a19e;font-size:12px;margin-top:13px}</style></head><body><main><div class="top"><div class="logo">AI</div><span>시니어 AI 생활비서</span><button class="share" onclick="shareApp()">↗ 공유</button></div><section id="home" class="screen on"><div class="hero"><h1>오늘은 무엇을 도와드릴까요?</h1><p>메뉴를 찾지 마세요. 그냥 말씀하시면 제가 알아서 도와드릴게요.</p><div class="askrow"><button class="ask voice" onclick="voice('general')">🎙 말로 부탁하기</button><button class="ask text" onclick="openText('general')">⌨ 글자로 부탁하기</button></div></div><div id="todayBox" class="box today" hidden></div><div class="sectionTitle">AI가 특히 잘 도와드려요</div><div class="grid"><button class="card" onclick="photo('explain')"><i>📸</i><b>이것 좀 봐줘</b><small>약·고지서·리모컨·제품을 찍으면 쉽게 설명</small></button><button class="card" onclick="showSearch()"><i>🧠</i><b>내 기억 찾아줘</b><small>병원·약속·할 일·메모를 다시 찾아드려요</small></button><button class="card" onclick="photo('safe')"><i>🚨</i><b>이거 괜찮아?</b><small>수상한 문자·송금 요청·안내문을 먼저 확인</small></button><button class="card" onclick="show('remember')"><i>📝</i><b>기억해 줘</b><small>말하면 병원·약속·할 일로 알아서 정리</small></button></div><button class="tools" onclick="show('tools')">생활도구 전체보기 〉</button><div class="version">시니어 AI 생활비서 v4.1</div></section><section id="remember" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>무엇을 기억할까요?</h1><div class="box">예: “오늘 동산병원 다녀왔어. 다음 진료는 9월 15일 오전 10시야.”<br>“내일 안경점에 전화해야 해.”</div><button class="btn" onclick="voice('remember')">🎙 말해서 기억하기</button><button class="btn alt" onclick="openText('remember')">⌨ 글자로 기억하기</button></section><section id="search" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>무엇을 찾아드릴까요?</h1><button class="btn" onclick="voice('search')">🎙 말로 찾기</button><input id="searchInput" class="input" placeholder="예: 병원 언제 가지?"><button class="btn alt" onclick="searchNow()">⌕ 찾아보기</button><div id="memoryList"></div></section><section id="text" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1 id="textTitle">편하게 적어주세요</h1><textarea id="textInput" class="input" rows="5" placeholder="여기에 적어주세요"></textarea><button class="btn" onclick="submitText()">확인</button></section><section id="voice" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>편하게 말씀하세요</h1><div id="voiceStatus" class="box">🎙 듣고 있어요...</div><button class="btn alt" onclick="openText(currentMode)">⌨ 글자로 바꾸기</button></section><section id="ask" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>처리했습니다</h1><div id="answer" class="box"></div><button class="btn" onclick="speakAnswer()">🔊 소리로 듣기</button></section><section id="tools" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>생활도구</h1><div class="grid"><button class="card" onclick="naverSearch('근처 맛집')"><i>🍚</i><b>먹을 곳</b><small>근처 식당 찾기</small></button><button class="card" onclick="openText('nav')"><i>🗺️</i><b>길찾기</b><small>목적지를 말하거나 쓰기</small></button><button class="card" onclick="showMsg('음악 기능은 새 재생방식을 준비 중입니다.')"><i>🎵</i><b>음악</b><small>트로트·7080·찬양</small></button><button class="card" onclick="showMsg('가족 연락 기능은 다음 세부 개선에서 복원합니다.')"><i>👨‍👩‍👧</i><b>가족 연락</b><small>전화·문자 보내기</small></button></div></section><section id="preview" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1>이 사진을 확인할까요?</h1><img id="img" style="width:100%;max-height:350px;object-fit:contain;border-radius:18px"><button class="btn" onclick="analyze()">AI에게 확인해 주세요</button></section><section id="result" class="screen"><button class="back" onclick="show('home')">⌂ 처음으로</button><h1 id="resultTitle">확인 결과</h1><div id="resultText" class="box"></div><button class="btn" onclick="speakResult()">🔊 소리로 듣기</button></section><input id="photo" hidden type="file" accept="image/*" capture="environment" onchange="picked(this)"></main><script>let currentMode='general',photoMode='explain',file=null,lastText='';const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0);if(id==='home')refreshToday()}function showMsg(t){lastText=t;$('answer').textContent=t;show('ask')}function openText(m){currentMode=m;$('textInput').value='';$('textTitle').textContent=m==='remember'?'기억할 내용을 적어주세요':m==='nav'?'어디로 갈까요?':'무엇이든 부탁하세요';show('text')}function submitText(){let q=$('textInput').value.trim();if(!q)return alert('내용을 적어주세요.');handle(q,currentMode)}function voice(mode){currentMode=mode;show('voice');const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){$('voiceStatus').textContent='음성 인식을 사용할 수 없어요. 글자로 적어주세요.';return}let r=new S();r.lang='ko-KR';r.onresult=e=>{let q=e.results[0][0].transcript;$('voiceStatus').textContent='“'+q+'”로 들었습니다.';setTimeout(()=>handle(q,mode),300)};r.onerror=()=>{$('voiceStatus').textContent='잘 듣지 못했어요. 글자로 적어도 됩니다.'};r.start()}function handle(q,mode){if(mode==='remember'){saveMemory(q);return}if(mode==='search'){searchMemories(q);return}if(mode==='nav'){naverSearch(q);return}if(/기억해|메모해|잊지|병원.*다녀|다음.*진료|해야 해|해야돼/.test(q)){saveMemory(q.replace(/기억해\s*줘|메모해\s*줘/g,'').trim());return}if(/기억|메모|지난번|언제 갔|언제 가지|일정|약속/.test(q)){searchMemories(q);return}askAI(q)}function memories(){return JSON.parse(localStorage.getItem('senior_memories_v2')||'[]')}function put(a){localStorage.setItem('senior_memories_v2',JSON.stringify(a.slice(0,200)))}function classify(t){if(/병원|의원|내과|외과|안과|치과|정형외과|진료|검사|약국/.test(t))return'병원';if(/약속|만나|모임|예배|방문|예약/.test(t))return'약속';if(/해야|전화|사야|챙겨|할 일|가져가/.test(t))return'할 일';return'생활메모'}function pad(n){return String(n).padStart(2,'0')}function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function extractDate(t){let now=new Date(),m=t.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){let d=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()-1))d.setFullYear(d.getFullYear()+1);return fmt(d)}if(/모레/.test(t)){let d=new Date(now);d.setDate(d.getDate()+2);return fmt(d)}if(/내일/.test(t)){let d=new Date(now);d.setDate(d.getDate()+1);return fmt(d)}if(/오늘/.test(t))return fmt(now);return''}function extractTime(t){let m=t.match(/(오전|오후)?\s*(\d{1,2})시(?:\s*(\d{1,2})분)?/);if(!m)return'';let h=+m[2];if(m[1]==='오후'&&h<12)h+=12;if(m[1]==='오전'&&h===12)h=0;return pad(h)+':'+pad(+(m[3]||0))}function saveMemory(text){let a=memories(),obj={id:Date.now(),text,category:classify(text),eventDate:extractDate(text),eventTime:extractTime(text),createdAt:new Date().toISOString()};a.unshift(obj);put(a);lastText='기억해 두었어요. '+obj.category+(obj.eventDate?' / '+obj.eventDate:'')+(obj.eventTime?' '+obj.eventTime:'')+'. '+text;$('answer').textContent=lastText;show('ask');refreshToday()}function showSearch(){let a=memories();renderMemories(a);show('search')}function searchNow(){searchMemories($('searchInput').value.trim())}function searchMemories(q){$('searchInput').value=q;let a=memories(),words=q.replace(/언제|가지|갔지|찾아|보여줘|내가|뭐|있어/g,' ').split(/\s+/).filter(x=>x.length>1);let f=a.filter(x=>words.some(w=>x.text.includes(w)||x.category.includes(w)));if(!f.length&&/병원|진료|내과|안과|치과/.test(q))f=a.filter(x=>x.category==='병원');if(!f.length&&/약속|일정/.test(q))f=a.filter(x=>x.category==='약속');renderMemories(f);show('search');if(f.length){let x=f[0];lastText=(x.eventDate?x.eventDate+(x.eventTime?' '+x.eventTime:'')+'에 ':'')+x.text+' 기록이 있어요.'}else lastText='찾는 기록이 없어요.'}function renderMemories(a){$('memoryList').innerHTML=a.slice(0,30).map(x=>'<div class="item"><span class="tag">'+esc(x.category)+'</span>'+(x.eventDate?'<span class="tag dateTag">'+x.eventDate+(x.eventTime?' '+x.eventTime:'')+'</span>':'')+'<b>'+esc(x.text)+'</b><small>저장 '+new Date(x.createdAt).toLocaleDateString('ko-KR')+'</small><div class="actions"><button class="smallBtn" onclick="editMemory('+x.id+')">수정</button><button class="smallBtn delete" onclick="deleteMemory('+x.id+')">삭제</button></div></div>').join('')||'<div class="box">찾는 기록이 없어요.</div>'}function editMemory(id){let a=memories(),x=a.find(v=>v.id===id);if(!x)return;let t=prompt('내용을 수정하세요',x.text);if(t===null||!t.trim())return;x.text=t.trim();x.category=classify(x.text);x.eventDate=extractDate(x.text);x.eventTime=extractTime(x.text);put(a);renderMemories(a)}function deleteMemory(id){if(!confirm('이 기록을 삭제할까요?'))return;let a=memories().filter(x=>x.id!==id);put(a);renderMemories(a);refreshToday()}function refreshToday(){let a=memories(),today=fmt(new Date()),tom=new Date();tom.setDate(tom.getDate()+1);let tomorrow=fmt(tom),f=a.filter(x=>x.eventDate===today||x.eventDate===tomorrow).slice(0,3);$('todayBox').hidden=!f.length;$('todayBox').innerHTML=f.length?'<b>📌 오늘·내일 기억할 일</b><br>'+f.map(x=>'• '+(x.eventDate===today?'오늘':'내일')+(x.eventTime?' '+x.eventTime:'')+' '+esc(x.text)).join('<br>'):''}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function askAI(q){show('ask');$('answer').textContent='AI가 생각하고 있어요…';try{let r=await fetch('/api/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});if(!r.ok)throw 0;let p=await r.json();lastText=p.answer||'답변을 준비하지 못했어요.';$('answer').textContent=lastText}catch(e){lastText='잠시 뒤 다시 물어봐 주세요.';$('answer').textContent=lastText}}function photo(mode){photoMode=mode;$('photo').click()}function picked(i){file=i.files&&i.files[0];if(!file)return;$('img').src=URL.createObjectURL(file);show('preview')}async function analyze(){if(!file)return;show('result');$('resultTitle').textContent='확인 중입니다';$('resultText').textContent='잠시만 기다려 주세요.';let fd=new FormData();fd.append('image',file);fd.append('mode',photoMode);fd.append('voice_context',photoMode==='safe'?'이 사진이 사기, 송금, 위험한 안내인지 특히 조심해서 확인해 주세요.':'시니어가 지금 무엇을 하면 되는지 쉽게 설명해 주세요.');try{let r=await fetch('/api/v1/analyze-image',{method:'POST',body:fd});if(!r.ok)throw 0;let p=await r.json(),a=p.analysis||p,pts=[...(a.important_points||[]),...((a.risk&&a.risk.reasons)||[])].slice(0,4);lastText=[a.summary,...pts].filter(Boolean).join('. ');$('resultTitle').textContent=a.summary||'확인했습니다';$('resultText').innerHTML=pts.map(x=>'• '+esc(x)).join('<br>')||'사진을 확인했습니다.'}catch(e){lastText='확인을 끝내지 못했어요. 잠시 뒤 다시 시도해 주세요.';$('resultTitle').textContent='다시 확인이 필요해요';$('resultText').textContent=lastText}}function speak(t){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}function speakAnswer(){speak(lastText)}function speakResult(){speak(lastText)}function naverSearch(q){location.href='https://map.naver.com/p/search/'+encodeURIComponent(q)}async function shareApp(){try{if(navigator.share)await navigator.share({title:'시니어 AI 생활비서',text:'말하고 찍으면 AI가 쉽게 도와주는 생활비서입니다.',url:location.origin});else{await navigator.clipboard.writeText(location.origin);alert('앱 주소를 복사했습니다.')}}catch(e){}}refreshToday();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
