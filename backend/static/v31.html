<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#426b67"><link rel="manifest" href="/manifest.json"><title>시니어 AI 생활 도우미 v3.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#25302f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:600px;margin:auto;padding:20px 16px 40px}.screen{display:none}.screen.on{display:block}.top{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;margin-bottom:18px}.logo{width:44px;height:44px;border-radius:15px;background:#426b67;color:white;display:grid;place-items:center}.hero{background:#426b67;color:#fff;border-radius:28px;padding:28px 22px}.hero h1,h1{font-size:36px;line-height:1.25;letter-spacing:-1px;margin:0 0 12px;word-break:keep-all}.hero p{font-size:21px;line-height:1.55;margin:0;color:#f0f6f3}.mic{width:100%;min-height:92px;border:0;border-radius:22px;background:#fff;color:#355d59;font-size:27px;font-weight:900;margin-top:20px}.title{font-size:20px;font-weight:900;margin:27px 4px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card,.choice,.btn{border:0;border-radius:22px;font-weight:900}.card{min-height:155px;background:#fff;padding:20px 16px;text-align:left;box-shadow:0 7px 20px #2333}.card .i{font-size:38px;display:block;margin-bottom:9px}.card b{font-size:23px;line-height:1.3}.card small{display:block;font-size:16px;line-height:1.45;color:#687675;margin-top:7px}.wide{grid-column:1/-1;min-height:110px}.back{border:0;background:transparent;color:#426b67;font-size:20px;font-weight:900;padding:10px 0 18px}.box{background:#fff;border-radius:22px;padding:21px;margin:14px 0;font-size:21px;line-height:1.6;box-shadow:0 7px 20px #2332}.btn{width:100%;min-height:74px;background:#426b67;color:white;font-size:22px;padding:15px;margin:7px 0}.alt{background:#e8efeb;color:#34514f}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;min-height:100px;font-size:21px;padding:14px;box-shadow:0 6px 18px #2332}.choice span{font-size:31px;display:block;margin-bottom:6px}.answer{font-size:22px;line-height:1.7}.status{text-align:center;font-size:24px;font-weight:900}.version{text-align:center;color:#98a39f;margin-top:20px;font-size:13px}img{width:100%;max-height:340px;object-fit:contain;border-radius:20px;background:#e8efeb}.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools .btn{font-size:18px}.warn{background:#fff4d8;color:#5d4a16}@media(max-width:390px){.hero h1,h1{font-size:33px}.hero p{font-size:20px}.mic{font-size:24px}.card b{font-size:21px}.card small{font-size:15px}.box{font-size:19px}.choice{font-size:19px}}</style></head><body><main><div class="top"><div class="logo">AI</div>시니어 AI 생활 도우미</div><section id="home" class="screen on"><div class="hero"><h1>무엇을 도와드릴까요?</h1><p>찾는 법을 몰라도 괜찮아요.<br>버튼을 누르거나 그냥 말씀하세요.</p><button class="mic" onclick="voice('general')">🎙️ 말로 물어보기</button></div><div class="title">자주 쓰는 도움</div><div class="grid"><button class="card" onclick="photo()"><span class="i">📷</span><b>사진으로 확인</b><small>문자·제품·안내문을 보여주세요</small></button><button class="card" onclick="food()"><span class="i">🍚</span><b>먹을 곳 찾기</b><small>말하거나 같이 메뉴를 골라요</small></button><button class="card" onclick="nav()"><span class="i">🚌</span><b>길·대중교통</b><small>가고 싶은 곳만 말씀하세요</small></button><button class="card" onclick="health()"><span class="i">💊</span><b>건강생활 도움</b><small>약·제품을 쉬운 말로 확인해요</small></button><button class="card wide" onclick="voice('ask')"><span class="i">🏠</span><b>생활 속 궁금한 것</b><small>고지서, 기계 사용법, 생활 질문을 AI에게 물어보세요</small></button><button class="card wide" onclick="family()"><span class="i">👨‍👩‍👧</span><b>가족에게 도움 요청</b><small>혼자 어렵다면 가족에게 바로 알려요</small></button></div><div class="version">시니어 AI 생활 도우미 v3.1</div></section><section id="food" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>오늘 뭐 드시고 싶으세요?</h1><button class="btn" onclick="voice('food')">🎙️ 먹고 싶은 음식 말하기</button><button class="btn alt" onclick="show('foodPick')">😊 뭘 먹을지 같이 골라줘</button><div class="box">말하기 어려우시면 아래의 <b>“같이 골라줘”</b>를 누르세요. 제가 하나씩 여쭤볼게요.</div></section><section id="foodPick" class="screen"><button class="back" onclick="show('food')">← 뒤로</button><h1>어떤 음식이 당기세요?</h1><div class="choices"><button class="choice" onclick="foodType('한식')"><span>🍚</span>한식</button><button class="choice" onclick="foodType('면 국수')"><span>🍜</span>면·국수</button><button class="choice" onclick="foodType('생선 해물')"><span>🐟</span>생선·해물</button><button class="choice" onclick="foodType('고기')"><span>🥩</span>고기</button><button class="choice" onclick="foodType('중식')"><span>🥟</span>중식</button><button class="choice" onclick="foodType('일식')"><span>🍣</span>일식</button><button class="choice" onclick="foodType('양식')"><span>🍝</span>양식</button><button class="choice" onclick="foodType('카페 간식')"><span>☕</span>카페·간식</button></div><button class="btn alt" onclick="moodFood()">🤔 이것도 잘 모르겠어요</button></section><section id="voice" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>편하게 말씀하세요</h1><div id="voiceStatus" class="box status">🎙️ 듣고 있어요...</div><button class="btn alt" onclick="show('home')">취소</button></section><section id="ask" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>쉽게 설명해 드릴게요</h1><div id="answer" class="box answer"></div><div class="tools"><button class="btn warn" onclick="speakAnswer()">🔊 소리로 듣기</button><button class="btn alt" onclick="family()">👨‍👩‍👧 가족에게 보내기</button></div><button class="btn" onclick="voice('ask')">🎙️ 다시 물어보기</button></section><section id="simple" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1 id="st"></h1><div id="sb" class="box"></div><button id="sa" class="btn"></button></section><section id="preview" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1>이 사진을 확인할까요?</h1><img id="img"><button class="btn" onclick="analyze()">AI에게 확인해 주세요</button><button class="btn alt" onclick="photo()">다시 찍기</button></section><section id="loading" class="screen"><h1>제가 살펴보고 있어요</h1><div class="box status">잠시만 기다려 주세요.</div></section><section id="result" class="screen"><button class="back" onclick="show('home')">← 처음으로</button><h1 id="rh"></h1><div id="rr" class="box"></div><div class="tools"><button class="btn warn" onclick="speakResult()">🔊 소리로 듣기</button><button class="btn alt" onclick="family()">👨‍👩‍👧 가족에게 보내기</button></div><button class="btn" onclick="photo()">다른 사진 확인</button></section><input id="photo" hidden type="file" accept="image/*" capture="environment" onchange="picked(this)"><script>let file=null,lastText='';const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}function simple(t,b,l,f){$('st').textContent=t;$('sb').innerHTML=b;$('sa').textContent=l;$('sa').onclick=f;show('simple')}function food(){show('food')}function foodType(q){simple('좋아요. '+q+'을 찾아볼게요','현재 위치 주변의 <b>'+q+'</b> 식당을 지도에서 쉽게 볼 수 있어요.','가까운 곳 보기',()=>nearby(q+' 맛집'))}function moodFood(){simple('제가 같이 골라드릴게요','따뜻한 음식이 좋으세요?','🍲 따뜻한 음식',()=>simple('국물이 좋으세요?','국물이 있는 음식이면 <b>칼국수·국밥·찌개</b>가 좋아요.','칼국수 찾아보기',()=>nearby('칼국수 맛집')))}function nearby(q){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)+'&center='+p.coords.latitude+','+p.coords.longitude,()=>location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q));else location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function nav(){simple('어디로 가고 싶으세요?','목적지만 말씀하세요.<br>예: <b>“동대구역 가고 싶어”</b>','🎙️ 목적지 말하기',()=>voice('nav'))}function health(){simple('건강생활 도움','약 봉투나 건강제품을 사진으로 보여주세요. <b>쉬운 말로 설명</b>해 드립니다.<br><br>진단이나 처방을 대신하지 않습니다.','📷 사진으로 보여주기',photo)}function photo(){$('photo').click()}function picked(i){file=i.files&&i.files[0];if(!file)return;$('img').src=URL.createObjectURL(file);show('preview')}async function analyze(){if(!file)return;show('loading');let fd=new FormData();fd.append('image',file);fd.append('mode','safe');fd.append('voice_context','');try{let r=await fetch('/api/v1/analyze-image',{method:'POST',body:fd});if(!r.ok)throw 0;let p=await r.json(),a=p.analysis||p;let reasons=(a.risk&&a.risk.reasons)||a.important_points||[];$('rh').textContent=a.summary||'확인했습니다.';$('rr').innerHTML='<b>중요한 점</b><br>'+reasons.slice(0,3).map(x=>'• '+esc(x)).join('<br>');lastText=[a.summary,...reasons].join('. ');show('result')}catch(e){simple('확인을 끝내지 못했어요','잠시 후 다시 시도해 주세요.','다시 확인',analyze)}}function voice(mode){show('voice');const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){$('voiceStatus').innerHTML='이 휴대폰에서는 음성 인식을 바로 사용할 수 없어요.';return}let r=new S();r.lang='ko-KR';r.onresult=e=>route(e.results[0][0].transcript,mode);r.onerror=()=>{$('voiceStatus').textContent='잘 듣지 못했어요. 다시 말씀해 주세요.'};r.start()}function route(q,mode){$('voiceStatus').textContent='“'+q+'”';if(mode==='food'||/먹|맛집|식당|국수|한식|해물|고기|카페/.test(q)){nearby(q);return}if(mode==='nav'||/가고|길|버스|지하철|교통|역/.test(q)){location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q.replace(/가고 싶어|가고싶어|길 알려줘/g,''));return}askAI(q)}async function askAI(q){show('loading');try{let r=await fetch('/api/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});if(!r.ok)throw 0;let p=await r.json();lastText=p.answer||'답변을 준비하지 못했어요.';$('answer').textContent=lastText;show('ask')}catch(e){simple('답변을 가져오지 못했어요','잠시 후 다시 말씀해 주세요.','다시 물어보기',()=>voice('ask'))}}function speak(t){if(!('speechSynthesis'in window))return alert('이 휴대폰에서는 소리로 읽기를 지원하지 않아요.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.88;speechSynthesis.speak(u)}function speakAnswer(){speak(lastText)}function speakResult(){speak(lastText)}async function family(){let d={title:'시니어 AI 생활 도우미',text:lastText||'시니어 AI 생활 도우미를 알려드려요.',url:location.origin};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.origin);alert('주소를 복사했어요. 가족에게 보내주세요.')}}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
