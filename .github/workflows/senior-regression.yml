name: Senior App Regression Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker.js
      - name: Verify protected senior flows
        shell: bash
        run: |
          set -euo pipefail
          f=cloudflare/worker.js
          required=(
            "const VERSION='5.4.0'"
            "/api/v1/ask"
            "/api/v1/compose-message"
            "/api/v1/cooking"
            "/api/v1/disposal"
            "/api/v1/phone-help"
            "/api/v1/analyze-image"
            "voiceAsk()"
            "photo(\\'explain\\')"
            "photo(\\'safe\\')"
            "openTravel(\\'route\\')"
            "show(\\'remember\\')"
            "show(\\'parking\\')"
            "openMessageHelp()"
          )
          for token in "${required[@]}"; do
            grep -Fq "$token" "$f" || { echo "Missing protected flow: $token"; exit 1; }
          done
          echo "Protected senior flows are present."
      - name: Verify four-action navigation targets
        shell: bash
        run: |
          set -euo pipefail
          base=backend/static/v43.html
          for id in home parking memory remember tools travel; do
            grep -Fq "id=\"$id\"" "$base" || { echo "Missing screen target: $id"; exit 1; }
          done
          for fn in "function voiceAsk" "function photo" "function openTravel" "function show"; do
            grep -Fq "$fn" "$base" || { echo "Missing base function: $fn"; exit 1; }
          done
          echo "Four-action navigation targets and base functions are wired."
      - name: Verify PWA core assets and manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          base=backend/static/v43.html
          test -f "$base"
          if test -f backend/static/manifest.json; then manifest=/manifest.json; elif test -f backend/static/manifest.webmanifest; then manifest=/manifest.webmanifest; else echo "Missing PWA manifest"; exit 1; fi
          grep -Fq "rel=\"manifest\"" "$base" || { echo "Base screen is not wired to a manifest"; exit 1; }
          grep -Fq "$manifest" "$base" || { echo "Manifest link does not match available manifest: $manifest"; exit 1; }
          echo "PWA core assets and manifest wiring are present."
      - name: Build verified deployment ZIP
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/senior-ai-life-platform_v5.4.0_verified.zip cloudflare backend/static wrangler.jsonc package.json package-lock.json -x 'backend/static/__pycache__/*' '*.pyc'
          sha256sum dist/senior-ai-life-platform_v5.4.0_verified.zip > dist/SHA256SUMS.txt
      - name: Upload verified deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: senior-ai-life-platform-v5.4.0-verified
          path: |
            dist/senior-ai-life-platform_v5.4.0_verified.zip
            dist/SHA256SUMS.txt
          retention-days: 30
